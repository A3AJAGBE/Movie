<div class="col-lg-4">
    <div class="card-deck">
        <div class="card mb-3">
            <a href="{{ movie.get_absolute_url }}">
                <img src="{{ movie.Image.url }}" class="card-img" alt="{{ movie.Title }} Poster">
            </a>
            <div class="card-body">
                <h3 class="card-title text-dark">{{ movie.Title | title }} </h3>
                <small class="text-muted">{{ movie.Uploaded_on.date }} |
                    <strong>Genre:</strong>
                    {% for genre in movie.Genre.all %}
                    <a href="{% url 'genre' genre.Name %}">{{ genre.Name }}</a>&nbsp;
                    {% endfor %}
                </small>
            </div>
            <div class="card-footer">
                <a href="{{ movie.get_add_to_cart_url }}" class="btn btn-primary btn-lg btn-block" role="button">Add to <i class="fas fa-shopping-bag"></i> for
                    {% if movie.Discount %}
                        <span class="mr-1 price">
                            <del>€{{ movie.Price }}</del>
                        </span>
                        <span class="badge bg-dark price">€{{ movie.Discount }}</span>
                    {% else %}
                        <span class="badge bg-dark price">€{{ movie.Price }}</span>
                    {% endif %}
                </a>
              </div>
        </div>
    </div>
</div>
