<div class="col-lg-4">
    <div class="card-deck">
        <div class="card mb-3">
            <a href="{{ movie.get_absolute_url }}">
                <img src="{{ movie.Image.url }}" class="card-img" alt="{{ movie.Title }} Poster">
            </a>
            <div class="card-body">
                <h3 class="card-title text-dark">{{ movie.Title | title }} </h3>
                <small class="text-muted">{{ movie.Uploaded_on.date }} |
                    <strong>Genre:</strong>
                    {% for genre in movie.Genre.all %}
                    <a href="#">{{ genre.Name }}</a>&nbsp;
                    {% endfor %}
                </small>
            </div>
            <div class="card-footer">
                <a href="#" class="btn btn-primary btn-lg btn-block" role="button">Add to Bag for €{{ movie.Price }}</a>
              </div>
        </div>
    </div>
</div>
