{% extends "openid/base.html" %}
{% load i18n %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %} OpenID Sign In | {{ block.super }} {% endblock %}

{% block content %}
<div class="row justify-content-center top">
    <div class="col-sm-6 text-primary">

        <div class="card">
            <div class="card-header">
                <img class="rounded mx-auto d-block" src="{% static 'images/M.png' %}" alt="M Logo" height="100">
            </div>
            <div class="card-body">
                <h1 class="text-center">{% trans 'OpenID Sign In' %}</h1>

                <form id="openid_login_form" class="openid_login" method="post" action="{% url 'openid_login' %}">
                {% csrf_token %}
                {{ form|crispy }}
                <button class="btn btn-primary btn-lg btn-block" type="submit">Sign In</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
