{% extends "base.html" %}
{% load i18n %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %} {% trans "Set Password" %} | {{ block.super }} {% endblock %}

{% block content %}
<div class="row justify-content-center top">
    <div class="col-sm-6 text-primary">
        {% include 'messages.html' %}

        <div class="card">
            <div class="card-header">
                <img class="rounded mx-auto d-block" src="{% static 'images/M.png' %}" alt="M Logo" height="100">
            </div>
            <div class="card-body">
                <h1 class="text-center">{% trans "Set Password" %}</h1>

                <form method="POST" action="{% url 'account_set_password' %}" class="password_set" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" name="action" class="btn btn-primary btn-lg btn-block">{% trans 'Set Password' %}</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
